n.classList.toggle(\"is-open\", open);\n  });\n  document.addEventListener(\"keydown\", (event) => {\n    if (\n      event.key === \"Escape\" &&\n      toggle.getAttribute(\"aria-expanded\") === \"true\"\n    ) {\n      close();\n      toggle.focus();\n    }\n  });\n  navigation.addEventListener(\"click\", close);\n}\n\nconst filters = document.querySelectorAll(\"[data-filter]\");\nif (filters.length) {\n  document.querySelector(\".filter-bar\").hidden = false;\n  filters.forEach((button) =>\n    button.addEventListener(\"click\", () => {\n      let visible = 0;\n      filters.forEach((filter) =>\n        filter.setAttribute(\"aria-pressed\", String(filter === button)),\n      );\n      document.querySelectorAll(\"[data-category]\").forEach((project) => {\n        project.hidden =\n          button.dataset.filter !== \"all\" &&\n          project.dataset.category !== button.dataset.filter;\n        if (!project.hidden) visible += 1;\n      });\n      document.querySelector(\"#filter-status\").textContent =\n        `${visible} ${visible === 1 ? \"fictief project\" : \"fictieve projecten\"}`;\n    }),\n  );\n}\n\nconst form = document.querySelector(\"#contact-form\");\nif (form) {\n  const status = document.querySelector(\"#form-status\");\n  form.addEventListener(\"submit\", (event) => {\n    event.preventDefault();\n    const errors = validateContact(Object.fromEntries(new FormData(form)));\n    for (const id of [\"name\", \"email\", \"message\"]) {\n      const field = form.elements.namedItem(id);\n      field.setAttribute(\"aria-invalid\", String(Boolean(errors[id])));\n      document.getElementById(`${id}-error`).textContent = errors[id] || \"\";\n    }\n    const firstInvalid = Object.keys(errors)[0];\n    if (firstInvalid) {\n      status.textContent =\n        \"Controleer de gemarkeerde velden. Er is niets verstuurd.\";\n      form.elements.namedItem(firstInvalid).focus();\n      return;\n    }\n    status.textContent =\n      \"Uw demo-invoer is geldig. Er is niets verstuurd of opgeslagen. Deze website heeft geen backend of contactdienst.\";\n    status.focus();\n  });\n  form.addEventListener(\"input\", (event) => {\n    status.textContent = \"\";\n    if (event.target.getAttribute(\"aria-invalid\") === \"true\") {\n      event.target.removeAttribute(\"aria-invalid\");\n      document.getElementById(`${event.target.id}-error`).textContent = \"\";\n    }\n  });\n  form.querySelector('[type=\"submit\"]').disabled = false;\n}\n\ndocument.addEventListener('click', event => {\n  const link = event.target.closest('a[href]');\n  if (!link) return;\n  const target = link.getAttribute('href');\n  if (/^(index|projecten|contact)\\.html(?:#.*)?$/.test(target)) {\n    event.preventDefault(); parent.openPreview(target);\n  }\n});\u003c/script>\u003c/body>\n\u003c/html>\n", "projecten.html": "\u003c!doctype html>\n\u003chtml lang=\"nl\">\n  \u003chead>\n    \u003cmeta charset=\"utf-8\" />\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n    \u003cmeta name=\"robots\" content=\"noindex, nofollow\" />\n    \u003cmeta name=\"referrer\" content=\"no-referrer\" />\n    \n    \u003ctitle>Projecten — Involfit B.V. · Architectuurdemonstratie\u003c/title>\n    \u003cmeta\n      name=\"description\"\n      content=\"Twee duidelijk fictieve architectuurconcepten: Duinwoning en Bospaviljoen, met lokaal gegenereerde illustraties.\"\n    />\n    \u003cmeta name=\"theme-color\" content=\"#f3efe7\" />\n    \u003clink rel=\"icon\" href=\"assets/mark.svg\" type=\"image/svg+xml\" />\n    \n    \n  \u003cstyle>:root {\n  --paper: #f3efe7;\n  --ink: #302a24;\n  --muted: #6f6358;\n  --line: #cfc4b7;\n  --accent: #8a452c;\n  --white: #faf8f3;\n  --serif: Georgia, \"Times New Roman\", serif;\n  --sans: Arial, Helvetica, sans-serif;\n}\n* {\n  box-sizing: border-box;\n}\nhtml {\n  scroll-behavior: smooth;\n  scroll-padding-top: 2rem;\n}\nbody {\n  margin: 0;\n  background: var(--paper);\n  color: var(--ink);\n  font: n-top: 0.8rem;\n}\n.form-note {\n  font-size: 0.78rem;\n  margin-bottom: 2rem;\n  color: var(--accent);\n}\n.form-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 1.6rem;\n}\n.field {\n  min-width: 0;\n}\n.field.full {\n  grid-column: 1/-1;\n}\nlabel {\n  display: block;\n  font-size: 0.76rem;\n  margin-bottom: 0.7rem;\n}\nlabel span {\n  font-size: 0.65rem;\n  color: var(--muted);\n}\ninput,\ntextarea,\nselect {\n  width: 100%;\n  border: 1px solid var(--line);\n  border-radius: 0;\n  background: var(--white);\n  padding: 0.85rem 0.9rem;\n  min-height: 48px;\n  font-size: 1rem;\n}\ntextarea {\n  resize: vertical;\n}\ninput[aria-invalid=\"true\"],\ntextarea[aria-invalid=\"true\"] {\n  border-color: #9b261e;\n}\n.field-error {\n  font-size: 0.75rem;\n  color: #9b261e;\n  margin-top: 0.35rem;\n  min-height: 1.25rem;\n}\n.submit-button {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 2rem;\n  width: 100%;\n  border: 1px solid var(--ink);\n  background: var(--ink);\n  color: var(--paper);\n  padding: 1rem 1.3rem;\n  margin-top: 1rem;\n  font-size: 0.82rem;\n  min-height: 54px;\n}\n.submit-button:hover {\n  background: #514236;\n}\n.submit-button:disabled {\n  opacity: 0.6;\n}\n.form-status:not(:empty) {\n  border-left: 3px solid var(--accent);\n  padding: 1rem;\n  background: var(--white);\n  margin-top: 1.5rem;\n  font-size: 0.88rem;\n}\n.skip-link {\n  position: fixed;\n  top: 1rem;\n  left: 1rem;\n  z-index: 10;\n  padding: 0.7rem 1rem;\n  background: var(--paper);\n  transform: translateY(-200%);\n}\n.skip-link:focus {\n  transform: translateY(0);\n}\n[hidden] {\n  display: none !important;\n}\n::selection {\n  background: #d9b69c;\n  color: var(--ink);\n}\n@media (min-width: 701px) {\n  .menu-toggle {\n    display: none;\n  }\n}\n@media (max-width: 900px) {\n  .contact-layout {\n    gap: 3rem;\n  }\n  .intro-section {\n    gap: 1.6rem;\n    grid-template-columns: 1fr 2fr;\n  }\n  .section-number {\n    display: none;\n  }\n  .site-footer {\n    gap: 1.5rem;\n  }\n  .hero-note br {\n    display: none;\n  }\n  .hero-note {\n    max-width: 29ch;\n  }\n}\n@media (max-width: 700px) {\n  .wrap {\n    width: 89%;\n  }\n  .demo-banner {\n    padding: 0.55rem 5.5%;\n    font-size: 0.53rem;\n    letter-spacing: 0.025em;\n  }\n  .demo-banner span {\n    display: none;\n  }\n  .site-header {\n    position: relative;\n    flex-wrap: wrap;\n    min-height: 97px;\n    gap: 0;\n  }\n  .wordmark {\n    font-size: 1.5rem;\n  }\n  .wordmark span {\n    font-size: 0.48rem;\n  }\n  .site-header nav {\n    width: 100%;\n    gap: 0;\n    justify-content: space-between;\n    padding: 0.8rem 0 1rem;\n  }\n  .site-header nav a {\n    padding: 0.6rem 0.3rem;\n  }\n  .site-header.has-menu nav {\n    display: none;\n  }\n  .site-header.has-menu nav.is-open {\n    display: flex;\n  }\n  .hero {\n    padding-top: 2.5rem;\n  }\n  .hero-intro {\n    display: block;\n    padding-bottom: 2.1rem;\n  }\n  .hero-intro > .eyebrow {\n    font-size: 0.59rem;\n    margin-bottom: 1.4rem;\n  }\n  h1 {\n    font-size: clamp(3.6rem, 12.8vw, 5.7rem);\n  }\n  .hero-note {\n    max-width: none;\n    justify-self: auto;\n    padding: 0;\n    margin-top: 1.6rem;\n    font-size: 0.82rem;\n  }\n  .hero-note p {\n    max-width: 34ch;\n  }\n  .hero-note .text-link {\n    margin-top: 1.1rem;\n  }\n  .hero-image img {\n    aspect-ratio: 0.92;\n    object-position: 67% center;\n  }\n  .hero-image figcaption {\n    font-size: 0.57rem;\n    gap: 1rem;\n  }\n  .hero-image figcaption span:last-child {\n    text-align: right;\n    max-width: 19ch;\n  }\n  .intro-section {\n    display: block;\n    padding-block: 3.3rem;\n  }\n  .intro-section > .eyebrow {\n    margin-bottom: 1.6rem;\n  }\n  .intro-section h2 {\n    font-size: 2.7rem;\n    margin-bottom: 1.5rem;\n  }\n  .intro-section p:not(.eyebrow) {\n    font-size: 0.85rem;\n  }\n  .selected {\n    padding-block: 3.5rem;\n  }\n  .section-heading {\n    display: block;\n    margin n  }\n  .contact-layout {\n    grid-template-columns: 1fr;\n    gap: 2.5rem;\n    padding-bottom: 3rem;\n  }\n  .contact-aside h2 {\n    font-size: 2.4rem;\n  }\n  .contact-aside > p {\n    font-size: 0.85rem;\n  }\n  .demo-notice {\n    margin-top: 1.5rem;\n  }\n  .form-grid {\n    grid-template-columns: 1fr;\n    gap: 1rem;\n  }\n  .form-note {\n    margin-bottom: 1.4rem;\n  }\n  .submit-button {\n    font-size: 0.76rem;\n    padding: 1rem;\n  }\n  .field-error {\n    min-height: 1rem;\n  }\n}\n@media (prefers-reduced-motion: reduce) {\n  html {\n    scroll-behavior: auto;\n  }\n  *,\n  *::before,\n  *::after {\n    transition: none !important;\n    animation: none !important;\n  }\n}\n\n.arrow {\n  display: inline-block;\n  flex-shrink: 0;\n  vertical-align: middle;\n  color: var(--accent);\n}\n.site-footer .arrow {\n  width: 13px;\n  height: 13px;\n}\n\u003c/style>\u003c/head>\n  \u003cbody>\n    \u003ca class=\"skip-link\" href=\"#inhoud\">Direct naar inhoud\u003c/a>\n    \u003cdiv class=\"demo-banner\">\n      Een architectuurdemonstratie van Involfit Digital\n      \u003cspan>Alle projecten zijn fictief\u003c/span>\n    \u003c/div>\n    \u003cheader class=\"site-header wrap\">\n      \u003ca class=\"wordmark\" href=\"index.html\" aria-label=\"Involfit B.V. — Home\"\n        >INVOLFIT\u003cspan>B.V. / ARCHITECTUURCONCEPT\u003c/span>\u003c/a\n      >\n      \u003cbutton\n        class=\"menu-toggle\"\n        aria-expanded=\"false\"\n        aria-controls=\"navigation\"\n        hidden\n      >\n        Menu \u003cspan aria-hidden=\"true\">☰\u003c/span>\n      \u003c/button>\n      \u003cnav id=\"navigation\" aria-label=\"Hoofdnavigatie\">\n        \u003ca href=\"index.html\">Home\u003c/a\n        >\u003ca href=\"projecten.html\" aria-current=\"page\">Projecten\u003c/a\n        >\u003ca href=\"contact.html\">Contact\u003c/a>\n      \u003c/nav>\n    \u003c/header>\n    \u003cmain id=\"inhoud\" class=\"wrap\">\n      \u003csection class=\"page-intro\">\n        \u003cp class=\"eyebrow\">Portfolio / conceptstudies\u003c/p>\n        \u003ch1>Plekken met\u003cbr />\u003cem>een eigen ritme.\u003c/em>\u003c/h1>\n        \u003cp class=\"lede\">\n          Twee denkbeeldige plekken, ontworpen om een idee zichtbaar te maken.\n          Dit zijn geen gerealiseerde projecten of klantopdrachten.\n        \u003c/p>\n      \u003c/section>\n      \u003cdiv class=\"filter-bar\" hidden>\n        \u003cdiv role=\"group\" aria-label=\"Filter projecten\">\n          \u003cbutton type=\"button\" data-filter=\"all\" aria-pressed=\"true\">\n            Alle projecten \u003cspan>02\u003c/span>\u003c/button\n          >\u003cbutton type=\"button\" data-filter=\"wonen\" aria-pressed=\"false\">\n            Wonen\u003c/button\n          >\u003cbutton type=\"button\" data-filter=\"cultuur\" aria-pressed=\"false\">\n            Cultuur\n          \u003c/button>\n        \u003c/div>\n        \u003cp id=\"filter-status\" role=\"status\">2 fictieve projecten\u003c/p>\n      \u003c/div>\n      \u003csection class=\"project-list\" aria-label=\"Fictieve projecten\">\n        \u003carticle class=\"project\" id=\"duinwoning\" data-category=\"wonen\">\n          \u003cfigure>\n            \u003cimg\n              class=\"\"\n              src=\"assets/duinwoning-1600.webp\"\n              srcset=\"\n                assets/duinwoning-720.webp   720w,\n                assets/duinwoning-1600.webp 1600w\n              \"\n              sizes=\"(max-width: 700px) 100vw, 85vw\"\n              width=\"1600\"\n              height=\"900\"\n              alt=\"Fictieve Duinwoning: gebogen zandkleurig beton boven een glazen gevel.\"\n              fetchpriority=\"high\"\n              decoding=\"async\"\n            />\n            \u003cfigcaption>\n              AI-gegenereerd conceptbeeld · geen bestaand gebouw\n            \u003c/figcaption>\n          \u003c/figure>\n          \u003cdiv class=\"project-description\">\n            \u003cspan class=\"eyebrow\">01 / Wonen / Fictief concept\u003c/span>\n            \u003cdiv>\n              \u003ch2>Duinwoning\u003c/h2>\n              \u003cp>\n                Een vloeiende dakrand als antwoord op het duin. Een beschutte\n                woonruimte, waar de horizon het interieur binnenkomt. Een\n                materiaalstudie in beton, glas en zandkleur.\n              \u003c/p>\n              \u003cdetails>\n                \u003csummary>\n                  Lees de ontwerpgedachte \u003cspan aria-hidden=\"true\">+\u003c/span>\n                \u003c/summary>\n                \u003cp>\n                  De gebogen vorm brengt schaduw en beschutting. De\n                  terugliggende glazen gevel opent het denkbeeldige huis naar\n                  het landschap. Deze visualisatie onderzoekt sfeer en\n                  verhoudingen; bouwbaarheid, locatie en vergunningen zijn niet\n                  onderzocht.\n                \u003c/p>\n              \u003c/details>\n            \u003c/div>\n          \u003c/div>\n        \u003c/article>\n        \u003carticle class=\"project\" id=\"bospaviljoen\" data-category=\"cultuur\">\n          \u003cfigure>\n            \u003cimg\n              class=\"\"\n              src=\"assets/bospaviljoen-1600.webp\"\n              srcset=\"\n                assets/bospaviljoen-720.webp   720w,\n                assets/bospaviljoen-1600.webp 1600w\n              \"\n              sizes=\"(max-width: 700px) 100vw, 85vw\"\n              width=\"1600\"\n              height=\"900\"\n              alt=\"Fictief Bospaviljoen: een laag houten gebouw tussen berken en mos.\"\n              loading=\"lazy\"\n              decoding=\"async\"\n            />\n            \u003cfigcaption>\n              AI-gegenereerd conceptbeeld · geen bestaand gebouw\n            \u003c/figcaption>\n          \u003c/figure>\n          \u003cdiv class=\"project-description\">\n            \u003cspan class=\"eyebrow\">02 / Cultuur / Fictief concept\u003c/span>\n            \u003cdiv>\n              \u003ch2>Bospaviljoen\u003c/h2>\n              \u003cp>\n                Een stille plek voor ontmoeting tussen de bomen. Verticale\n                houten lamellen filteren het licht; een breed dak legt een\n                rustige lijn in het bos.\n              \u003c/p>\n              \u003cdetails>\n                \u003csummary>\n                  Lees de ontwerpgedachte \u003cspan aria-hidden=\"true\">+\u003c/span>\n                \u003c/summary>\n                \u003cp>\n                  Dit fictieve paviljoen onderzoekt de overgang van buiten naar\n                  binnen. Het houten ritme verwijst naar de stammen rondom het\n                  gebouw. Er is geen opdrachtgever of bouwlocatie; het ontwerp\n                  is uitsluitend een sfeer- en materiaalstudie.\n                \u003c/p>\n              \u003c/details>\n            \u003c/div>\n          \u003c/div>\n        \u003c/article>\n      \u003c/section>\n      \u003csection class=\"closing\">\n        \u003cp class=\"eyebrow\">Een eerste verkenning\u003c/p>\n        \u003ch2>Wat zou uw\u003cbr />\u003cem>vraag zijn?\u003c/em>\u003c/h2>\n        \u003ca class=\"text-link\" href=\"contact.html\"\n          >Probeer het demoformulier\n          \u003csvg\n            class=\"arrow\"\n            width=\"22\"\n            height=\"22\"\n            viewBox=\"0 0 24 24\"\n            aria-hidden=\"true\"\n            focusable=\"false\"\n          >\n            \u003cpath\n              d=\"M5 19 19 5M5 5h14v14\"\n              fill=\"none\"\n              stroke=\"currentColor\"\n              stroke-width=\"1.25\"\n            />\u003c/svg\n        >\u003c/a>\n      \u003c/section>\n    \u003c/main>\n    \u003cfooter class=\"wrap site-footer\">\n      \u003ca class=\"wordmark\" href=\"index.html\"\n        >INVOLFIT\u003cspan>Een verkenning in architectuur.\u003c/span>\u003c/a\n      >\n      \u003cdiv>\n        \u003cp>Involfit B.V. · demonstratiewebsite\u003c/p>\n        \u003cp>Fictieve ontwerpen. AI-gegenereerde conceptbeelden.\u003c/p>\n        \u003cp>Geen werkelijk portfolio, vestigingsadres of contactdienst.\u003c/p>\n      \u003c/div>\n      \u003ca href=\"contact.html\"\n        >Over deze demo\n        \u003csvg\n          class=\"arrow\"\n          width=\"22\"\n          height=\"22\"\n          viewBox=\"0 0 24 24\"\n          aria-hidden=\"true\"\n          focusable=\"false\"\n        >\n          \u003cpath\n            d=\"M5 19 19 5M5 5h14v14\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            stroke-width=\"1.25\"\n          />\u003c/svg\n      >\u003c/a>\n    \u003c/footer>\n  \u003cscript>/** Pure local demo validation. No persistence or network side effects. */\nfunction validateContact(values) {\n  const errors = {};\n  const name = String(values.name ?? \"\").trim();\n  const email = String(values.email ?? \"\").trim();\n  const message = String(values.message ?? \"\").trim();\n  if (!name || name.length > 100)\n    errors.name = \"Vul uw naam in (maximaal 100 tekens).\";\n  if (email.length > 254 || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))\n    errors.email =\n      \"Vul een geldig e-mailadres in, bijvoorbeeld naam@example.com.\";\n  if (message.length \u003c 20 || message.length > 2000)\n    errors.message = \"Beschrijf uw idee in 20 tot 2000 tekens.\";\n  return errors;\n}\n\nconst toggle = document.querySelector(\".menu-toggle\");\nconst navigation = document.querySelector(\"#navigation\");\nif (toggle && navigation) {\n  document.querySelector(\".site-header\").classList.add(\"has-menu\");\n  toggle.hidden = false;\n  const close = () => {\n    toggle.setAttribute(\"aria-expanded\", \"false\");\n    navigation.classList.remove(\"is-open\");\n  };\n  toggle.addEventListener(\"click\", () => {\n    const open = toggle.getAttribute(\"aria-expanded\") !== \"true\";\n    toggle.setAttribute(\"aria-expanded\", String(open));\n    navigation.classList.toggle(\"is-open\", open);\n  });\n  document.addEventListener(\"keydown\", (event) => {\n    if (\n      event.key === \"Escape\" &&\n      toggle.getAttribute(\"aria-expanded\") === \"true\"\n    ) {\n      close();\n      toggle.focus();\n    }\n  });\n  navigation.addEventListener(\"click\", close);\n}\n\nconst filters = document.querySelectorAll(\"[data-filter]\");\nif (filters.length) {\n  document.querySelector(\".filter-bar\").hidden = false;\n  filters.forEach((button) =>\n    button.addEventListener(\"click\", () => {\n      let visible = 0;\n      filters.forEach((filter) =>\n        filter.setAttribute(\"aria-pressed\", String(filter === button)),\n      );\n      document.querySelectorAll(\"[data-category]\").forEach((project) => {\n        project.hidden =\n          button.dataset.filter !== \"all\" &&\n          project.dataset.category !== button.dataset.filter;\n        if (!project.hidden) visible += 1;\n      });\n      document.querySelector(\"#filter-status\").textContent =\n        `${visible} ${visible === 1 ? \"fictief project\" : \"fictieve projecten\"}`;\n    }),\n  );\n}\n\nconst form = document.querySelector(\"#contact-form\");\nif (form) {\n  const status = document.querySelector(\"#form-status\");\n  form.addEventListener(\"submit\", (event) => {\n    event.preventDefault();\n    const errors = validateContact(Object.fromEntries(new FormData(form)));\n    for (const id of [\"name\", \"email\", \"message\"]) {\n      const field = form.elements.namedItem(id);\n      field.setAttribute(\"aria-invalid\", String(Boolean(errors[id])));\n      document.getElementById(`${id}-error`).textContent = errors[id] || \"\";\n    }\n    const firstInvalid = Object.keys(errors)[0];\n    if (firstInvalid) {\n      status.textContent =\n        \"Controleer de gemarkeerde velden. Er is niets verstuurd.\";\n      form.elements.namedItem(firstInvalid).focus();\n      return;\n    }\n    status.textContent =\n      \"Uw demo-invoer is geldig. Er is niets verstuurd of opgeslagen. Deze website heeft geen backend of contactdienst.\";\n    status.focus();\n  });\n  form.addEventListener(\"input\", (event) => {\n    status.textContent = \"\";\n    if (event.target.getAttribute(\"aria-invalid\") === \"true\") {\n      event.target.removeAttribute(\"aria-invalid\");\n      document.getElementById(`${event.target.id}-error`).textContent = \"\";\n    }\n  });\n  form.querySelector('[type=\"submit\"]').disabled = false;\n}\n\ndocument.addEventListener('click', event => {\n  const link = event.target.closest('a[href]');\n  if (!link) return;\n  const target = link.getAttribute('href');\n  if (/^(index|projecten|contact)\\.html(?:#.*)?$/.test(target)) {\n    event.preventDefault(); parent.openPreview(target);\n  }\n});\u003c/script>\u003c/body>\n\u003c/html>\n", "contact.html": "\u003c!doctype html>\n\u003chtml lang=\"nl\">\n  \u003chead>\n    \u003cmeta charset=\"utf-8\" />\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n    \u003cmeta name=\"robots\" content=\"noindex, nofollow\" />\n    \u003cmeta name=\"referrer\" content=\"no-referrer\" />\n    \n    \u003ctitle>Contact — Involfit B.V. · Architectuurdemonstratie\u003c/title>\n    \u003cmeta\n      name=\"description\"\n      content=\"Probeer het lokale demoformulier. De invoer wordt alleen in uw browser gecontroleerd en nergens naartoe verstuurd.\"\n    />\n    \u003cmeta name=\"theme-color\" content=\"#f3efe7\" />\n    \u003clink rel=\"icon\" href=\"assets/mark.svg\" type=\"image/svg+xml\" />\n    \n    \n  \u003cstyle>:root {\n  --paper: #f3efe7;\n  --ink: #302a24;\n  --muted: #6f6358;\n  --line: #cfc4b7;\n  --accent: #8a452c;\n  --white: #faf8f3;\n  --serif: Georgia, \"Times New Roman\", serif;\n  --sans: Arial, Helvetica, sans-serif;\n}\n* {\n  box-sizing: border-box;\n}\nhtml {\n  scroll-behavior: smooth;\n  scroll-padding-top: 2rem;\n}\nbody {\n  margin: 0;\n  background: var(--paper);\n  color: var(--ink);\n  font: 16px/1.65 var(--sans);\n}\na {\n rid-template-columns: 1fr;\n    gap: 2.5rem;\n    padding-bottom: 3rem;\n  }\n  .contact-aside h2 {\n    font-size: 2.4rem;\n  }\n  .contact-aside > p {\n    font-size: 0.85rem;\n  }\n  .demo-notice {\n    margin-top: 1.5rem;\n  }\n  .form-grid {\n    grid-template-columns: 1fr;\n    gap: 1rem;\n  }\n  .form-note {\n    margin-bottom: 1.4rem;\n  }\n  .submit-button {\n    font-size: 0.76rem;\n    padding: 1rem;\n  }\n  .field-error {\n    min-height: 1rem;\n  }\n}\n@media (prefers-reduced-motion: reduce) {\n  html {\n    scroll-behavior: auto;\n  }\n  *,\n  *::before,\n  *::after {\n    transition: none !important;\n    animation: none !important;\n  }\n}\n\n.arrow {\n  display: inline-block;\n  flex-shrink: 0;\n  vertical-align: middle;\n  color: var(--accent);\n}\n.site-footer .arrow {\n  width: 13px;\n  height: 13px;\n}\n\u003c/style>\u003c/head>\n  \u003cbody>\n    \u003ca class=\"skip-link\" href=\"#inhoud\">Direct naar inhoud\u003c/a>\n    \u003cdiv class=\"demo-banner\">\n      Een architectuurdemonstratie van Involfit Digital\n      \u003cspan>Alle projecten zijn fictief\u003c/span>\n    \u003c/div>\n    \u003cheader class=\"site-header wrap\">\n      \u003ca class=\"wordmark\" href=\"index.html\" aria-label=\"Involfit B.V. — Home\"\n        >INVOLFIT\u003cspan>B.V. / ARCHITECTUURCONCEPT\u003c/span>\u003c/a\n      >\n      \u003cbutton\n        class=\"menu-toggle\"\n        aria-expanded=\"false\"\n        aria-controls=\"navigation\"\n        hidden\n      >\n        Menu \u003cspan aria-hidden=\"true\">☰\u003c/span>\n      \u003c/button>\n      \u003cnav id=\"navigation\" aria-label=\"Hoofdnavigatie\">\n        \u003ca href=\"index.html\">Home\u003c/a>\u003ca href=\"projecten.html\">Projecten\u003c/a\n        >\u003ca href=\"contact.html\" aria-current=\"page\">Contact\u003c/a>\n      \u003c/nav>\n    \u003c/header>\n    \u003cmain id=\"inhoud\" class=\"wrap\">\n      \u003csection class=\"page-intro\">\n        \u003cp class=\"eyebrow\">Contact / een eerste gedachte\u003c/p>\n        \u003ch1>Vertel over\u003cbr />\u003cem>uw ruimte.\u003c/em>\u003c/h1>\n      \u003c/section>\n      \u003cdiv class=\"contact-layout\">\n        \u003caside class=\"contact-aside\">\n          \u003ch2>Een idee hoeft\u003cbr />nog niet af te zijn.\u003c/h2>\n          \u003cp>\n            Een plek. Een materiaal. Een gevoel. Hier kunt u ervaren hoe een\n            eerste contactmoment eruit zou kunnen zien.\n          \u003c/p>\n          \u003cdiv class=\"demo-notice\">\n            \u003cp class=\"eyebrow\">Dit is een demo\u003c/p>\n            \u003cp>\n              Dit formulier verstuurt niets en slaat niets op. Er is geen\n              backend of contactdienst aangesloten. Gebruik bij het testen\n              fictieve gegevens.\n            \u003c/p>\n            \u003cp>\n              De naam Involfit B.V. wordt hier gebruikt voor een\n              architectuurdemonstratie; deze pagina doet geen uitspraken over\n              werkelijke architectuurdiensten.\n            \u003c/p>\n          \u003c/div>\n        \u003c/aside>\n        \u003cform id=\"contact-form\" novalidate aria-label=\"Lokaal demoformulier\">\n          \u003cp class=\"form-note\">\n            Alleen een lokale controle. Er wordt geen bericht verzonden.\n          \u003c/p>\n          \u003cdiv class=\"form-grid\">\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"name\">Uw naam \u003cspan>(verplicht)\u003c/span>\u003c/label\n              >\u003cinput\n                id=\"name\"\n                name=\"name\"\n                autocomplete=\"name\"\n                required\n                maxlength=\"100\"\n                aria-describedby=\"name-error\"\n              />\n              \u003cp class=\"field-error\" id=\"name-error\">\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"email\">E-mailadres \u003cspan>(verplicht)\u003c/span>\u003c/label\n              >\u003cinput\n                id=\"email\"\n                name=\"email\"\n                type=\"email\"\n                autocomplete=\"email\"\n                required\n                maxlength=\"254\"\n                aria-describedby=\"email-error\"\n              />\n              \u003cp class=\"field-error\" id=\"email-error\">\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"field full\">\n              \u003clabel for=\"interest\">Waar gaat uw idee over?\u003c/label\n              >\u003cselect id=\"interest\" name=\"interest\">\n                \u003coption value=\"verkenning\">Een eerste verkenning\u003c/option>\n                \u003coption value=\"wonen\">Wonen\u003c/option>\n                \u003coption value=\"cultuur\">Cultuur &amp; ontmoeting\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv class=\"field full\">\n              \u003clabel for=\"message\"\n                >Uw idee \u003cspan>(verplicht, 20–2000 tekens)\u003c/span>\u003c/label\n              >\u003ctextarea\n                id=\"message\"\n                name=\"message\"\n                rows=\"5\"\n                required\n                minlength=\"20\"\n                maxlength=\"2000\"\n                aria-describedby=\"message-error\"\n              >\u003c/textarea>\n              \u003cp class=\"field-error\" id=\"message-error\">\u003c/p>\n            \u003c/div>\n          \u003c/div>\n          \u003cbutton class=\"submit-button\" type=\"submit\" disabled>\n            Controleer mijn demo-invoer\n            \u003csvg\n              class=\"arrow\"\n              width=\"22\"\n              height=\"22\"\n              viewBox=\"0 0 24 24\"\n              aria-hidden=\"true\"\n              focusable=\"false\"\n            >\n              \u003cpath\n                d=\"M5 19 19 5M5 5h14v14\"\n                fill=\"none\"\n                stroke=\"currentColor\"\n                stroke-width=\"1.25\"\n              />\n            \u003c/svg>\u003c/button\n          >\u003cnoscript\n            >\u003cp>\n              JavaScript is uitgeschakeld. De formuliercontrole is niet\n              beschikbaar; er wordt niets verstuurd.\n            \u003c/p>\u003c/noscript\n          >\n          \u003cp\n            id=\"form-status\"\n            class=\"form-status\"\n            role=\"status\"\n            aria-live=\"polite\"\n            tabindex=\"-1\"\n          >\u003c/p>\n        \u003c/form>\n      \u003c/div>\n    \u003c/main>\n    \u003cfooter class=\"wrap site-footer\">\n      \u003ca class=\"wordmark\" href=\"index.html\"\n        >INVOLFIT\u003cspan>Een verkenning in architectuur.\u003c/span>\u003c/a\n      >\n      \u003cdiv>\n        \u003cp>Involfit B.V. · demonstratiewebsite\u003c/p>\n        \u003cp>Fictieve ontwerpen. AI-gegenereerde conceptbeelden.\u003c/p>\n        \u003cp>Geen werkelijk portfolio, vestigingsadres of contactdienst.\u003c/p>\n      \u003c/div>\n      \u003ca href=\"contact.html\"\n        >Over deze demo\n        \u003csvg\n          class=\"arrow\"\n          width=\"22\"\n          height=\"22\"\n          viewBox=\"0 0 24 24\"\n          aria-hidden=\"true\"\n          focusable=\"false\"\n        >\n          \u003cpath\n            d=\"M5 19 19 5M5 5h14v14\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            stroke-width=\"1.25\"\n          />\u003c/svg\n      >\u003c/a>\n    \u003c/footer>\n  \u003cscript>/** Pure local demo validation. No persistence or network side effects. */\nfunction validateContact(values) {\n  const errors = {};\n  const name = String(values.name ?? \"\").trim();\n  const email = String(values.email ?? \"\").trim();\n  const message = String(values.message ?? \"\").trim();\n  if (!name || name.length > 100)\n    errors.name = \"Vul uw naam in (maximaal 100 tekens).\";\n  if (email.length > 254 || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))\n    errors.email =\n      \"Vul een geldig e-mailadres in, bijvoorbeeld naam@example.com.\";\n  if (message.length \u003c 20 || message.length > 2000)\n    errors.message = \"Beschrijf uw idee in 20 tot 2000 tekens.\";\n  return errors;\n}\n\nconst toggle = document.querySelector(\".menu-toggle\");\nconst navigation = document.querySelector(\"#navigation\");\nif (toggle && navigation) {\n  document.querySelector(\".site-header\").classList.add(\"has-menu\");\n  toggle.hidden = false;\n  const close = () => {\n    toggle.setAttribute(\"aria-expanded\", \"false\");\n    navigation.classList.remove(\"is-open\");\n  };\n  toggle.addEventListener(\"click\", () => {\n    const open = toggle.getAttribute(\"aria-expanded\") !== \"true\";\n    toggle.setAttribute(\"aria-expanded\", String(open));\n    navigation.classList.toggle(\"is-open\", open);\n  });\n  document.addEventListener(\"keydown\", (event) => {\n    if (\n      event.key === \"Escape\" &&\n      toggle.getAttribute(\"aria-expanded\") === \"true\"\n    ) {\n      close();\n      toggle.focus();\n    }\n  });\n  navigation.addEventListener(\"click\", close);\n}\n\nconst filters = document.querySelectorAll(\"[data-filter]\");\nif (filters.length) {\n  document.querySelector(\".filter-bar\").hidden = false;\n  filters.forEach((button) =>\n    button.addEventListener(\"click\", () => {\n      let visible = 0;\n      filters.forEach((filter) =>\n        filter.setAttribute(\"aria-pressed\", String(filter === button)),\n      );\n      document.querySelectorAll(\"[data-category]\").forEach((project) => {\n        project.hidden =\n          button.dataset.filter !== \"all\" &&\n          project.dataset.category !== button.dataset.filter;\n        if (!project.hidden) visible += 1;\n      });\n      document.querySelector(\"#filter-status\").textContent =\n        `${visible} ${visible === 1 ? \"fictief project\" : \"fictieve projecten\"}`;\n    }),\n  );\n}\n\nconst form = document.querySelector(\"#contact-form\");\nif (form) {\n  const status = document.querySelector(\"#form-status\");\n  form.addEventListener(\"submit\", (event) => {\n    event.preventDefault();\n    const errors = validateContact(Object.fromEntries(new FormData(form)));\n    for (const id of [\"name\", \"email\", \"message\"]) {\n      const field = form.elements.namedItem(id);\n      field.setAttribute(\"aria-invalid\", String(Boolean(errors[id])));\n      document.getElementById(`${id}-error`).textContent = errors[id] || \"\";\n    }\n    const firstInvalid = Object.keys(errors)[0];\n    if (firstInvalid) {\n      status.textContent =\n        \"Controleer de gemarkeerde velden. Er is niets verstuurd.\";\n      form.elements.namedItem(firstInvalid).focus();\n      return;\n    }\n    status.textContent =\n      \"Uw demo-invoer is geldig. Er is niets verstuurd of opgeslagen. Deze website heeft geen backend of contactdienst.\";\n    status.focus();\n  });\n  form.addEventListener(\"input\", (event) => {\n    status.textContent = \"\";\n    if (event.target.getAttribute(\"aria-invalid\") === \"true\") {\n      event.target.removeAttribute(\"aria-invalid\");\n      document.getElementById(`${event.target.id}-error`).textContent = \"\";\n    }\n  });\n  form.querySelector('[type=\"submit\"]').disabled = false;\n}\n\ndocument.addEventListener('click', event => {\n  const link = event.target.closest('a[href]');\n  if (!link) return;\n  const target = link.getAttribute('href');\n  if (/^(index|projecten|contact)\\.html(?:#.*)?$/.test(target)) {\n    event.preventDefault(); parent.openPreview(target);\n  }\n});\u003c/script>\u003c/body>\n\u003c/html>\n"}, "assets": {"assets/bospaviljoen-720.webp": "data:image/webp;base64,UklGRh5WAQBXRUJQVlA4IBJWAQDwQwOdASrQApUBPkkcikOioaEXzIaoKASEsq+yAEN/6PhscCcrX3uwv975ptmjrXkleax5508v+b0UvI/+r6Dfo68Z2ZOUE6rSGFBWx/4DYH5m5RHJ/6f2bvAFsDemf5v0X/+N5ifMD7K+pP6AXz5/wPUw/zvrx/x/Gt+3f8P1F4bp+jDrFjyvKu5982o9f9/sN+X/6Hly+59+z/s+sD+7f7n2Ev7/6Nf/h66P8R/6fU5+3P7we8N/5/3a95P+M9Qn+8f8f1tf/n/////8Pf+F/+fsxfud60H/29of/B/+794vbY///sA const frame = document.getElementById('preview');
window.openPreview = target => { location.hash = target; };
function render() {
  const target = location.hash.slice(1) || 'index.html';
  const [name, anchor] = target.split('#');
  const file = Object.hasOwn(bundle.pages, name) ? name : 'index.html';
  let html = bundle.pages[file];
  for (const [path, uri] of Object.entries(bundle.assets)) html = html.replaceAll(path, uri);
  frame.title = 'Involfit offline demo — ' + file;
  frame.onload = () => {
    if (anchor) frame.contentDocument.getElementById(anchor)?.scrollIntoView();
  };
  frame.srcdoc = html;
}
window.addEventListener('hashchange', render);
render();</script></body></html>
